[package]
name = "ccert-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.ccert]
path = ".."

# Its own workspace, so a plain `cargo build` at the project root never
# reaches these targets — they need the nightly sanitizer flags that
# `cargo fuzz` supplies and nothing else does.
[workspace]
members = ["."]

[[bin]]
name = "verify_text"
path = "fuzz_targets/verify_text.rs"
test = false
doc = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false

[package]
name = "ccert-verify"
version = "0.0.0"
edition = "2021"
description = "Independent verifier for .ccert bundles"
license = "Apache-2.0"

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
sha1 = "0.10"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
strip = true

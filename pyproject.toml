[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curvecert"
version = "0.0.0"
description = "Machine-checkable dossiers for elliptic curves"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]
fast = ["gmpy2>=2.1"]

[tool.setuptools]
packages = ["core", "farm", "constants"]
package-data = {"core.policy" = ["policies/*.yaml"]}

[tool.pytest.ini_options]
testpaths = ["tests"]

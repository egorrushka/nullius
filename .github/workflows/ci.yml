name: build and verify

# Four things have to hold on every commit, checked in this order because
# each is cheaper than the next to diagnose.
#
#   1. The verifier builds clean and the suite passes.
#   2. Every certificate we ship still verifies, from the file alone.
#   3. A certificate rebuilt from scratch, on a machine that did not make
#      it, still verifies from the file alone. Byte-for-byte identity is
#      reported too, but is not required across PARI versions: the
#      primality chains are not unique, so a different version may pick a
#      different valid one. The byte guarantee holds against the version
#      the corpus was built with; verification holds against any.
#   4. The single-file page really is a single file.
#
# The third is the one worth having. A certificate whose claims cannot be
# re-established by a stranger's toolchain would be worthless; that it
# always can is the property the format rests on.
#
# Note that the rebuild loop asks tools.build_curve which curves exist
# rather than carrying its own list. A list here would go stale the first
# time a curve was added, and it did: this step used to call the
# prime-field builder for every vector it found, which would have failed
# the moment a pairing-friendly curve was published beside the others.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # Two runners, and therefore two PARI versions: the distributions ship
    # different ones, which is the cheapest honest way to exercise the
    # corpus against more than one. Part of every certificate is decided by
    # PARI — the Atkin-Morain primality chains go in verbatim — and those
    # chains are not unique, so a different version may build a different,
    # equally valid one.
    #
    # The two versions are witnesses, not a byte-equality test. What each
    # job requires is that a rebuilt certificate verifies from the file
    # alone; that is the property that holds on every version, and it is
    # failed hard. Byte-for-byte identity against the published vector is
    # reported per curve but is not a gate, because a cross-version chain
    # difference is a fact about ECPP rather than a broken build — the byte
    # guarantee is against the version the corpus was built with, which the
    # README states plainly.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PARI/GP
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp pari-seadata
          gp --version 2>&1 | head -3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install pytest pyyaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the verifier
        working-directory: verifier
        # A warning in a program people are asked to read end to end is
        # worth failing over: dead code there costs more than the
        # inconvenience of a red build.
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --release

      - name: Run the suite
        run: python -m pytest tests -q

      - name: Verify every published certificate
        run: |
          for cert in spec/vectors/valid/*.ccert; do
            echo "=== $cert"
            ./verifier/target/release/ccert-verify --require-proved "$cert"
          done

      # Reproducibility, stated as what actually holds across versions.
      #
      # A certificate's primality proof for p is an Atkin-Morain chain,
      # and those chains are not unique: for one prime there are many valid
      # ones, and PARI picks a different chain across versions. The
      # diagnostic run confirmed this precisely — on one runner all eight
      # curves rebuilt byte for byte, on the other two of them (bls12-381,
      # bls24-509) came out with different chains, and every rebuilt copy,
      # matching or not, still verified.
      #
      # So the gate is split. The property that must hold on every version
      # is that a rebuilt certificate re-establishes every claim from the
      # file alone: that is failed hard. Byte-for-byte identity is reported
      # but not failed on, because a cross-version chain difference is a
      # fact about ECPP, not a broken build — the byte guarantee is against
      # the version the corpus was built with, and the README says so. A
      # rebuilt copy that does NOT verify would be a real defect, and that
      # is the thing this step exists to catch.
      - name: Rebuild the corpus; every rebuild must verify
        run: |
          echo "PARI in use: $(gp --version 2>&1 | head -2 | tail -1)"
          mkdir -p /tmp/rebuilt
          same=""
          drift=""
          failed=""
          for name in $(python -m tools.build_curve --list); do
            vector="spec/vectors/valid/$name.ccert"
            if [ ! -f "$vector" ]; then
              echo "::error::$name has no published vector"
              exit 1
            fi
            python -m tools.build_curve --curve "$name" --out /tmp/rebuilt --quiet
            # The hard gate: the rebuild must verify, from the file alone.
            if ! ./verifier/target/release/ccert-verify --require-proved "/tmp/rebuilt/$name.ccert" >/dev/null 2>&1; then
              echo "::error::$name rebuilt but does not verify"
              failed="$failed $name"
              continue
            fi
            if cmp -s "$vector" "/tmp/rebuilt/$name.ccert"; then
              same="$same $name"
            else
              drift="$drift $name"
            fi
          done
          echo "reproduces byte-for-byte:$same"
          echo "differs (valid ECPP chain from this PARI version):$drift"
          if [ -n "$failed" ]; then
            echo "::error::these rebuilt certificates did not verify:$failed"
            exit 1
          fi
          echo "every rebuilt certificate verifies from the file alone"

      # The other half of the specification. Refusing these is not enough:
      # each must be refused for its own reason, because a defect masked
      # by another defect leaves the argument underneath untested.
      - name: Refuse every invalid vector, for the right reason
        run: python -m tools.make_invalid_vectors --check

      - name: Apply every policy to every certificate
        # Not a pass/fail gate on the verdicts themselves: a curve failing
        # a policy is a fact about the curve, not a broken build. What is
        # being checked is that every policy loads and evaluates without
        # raising, which catches a criterion naming a claim that no longer
        # exists.
        run: python -m core.policy.engine --corpus spec/vectors/valid

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - name: Publish the corpus for the page
        run: python tools/export_web.py --corpus spec/vectors/valid
      - name: Build the single-file page
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: The page must stand alone
        run: |
          if grep -qE 'src="(http|\./assets|/assets)' web/dist/index.html; then
            echo "::error::the built page loads something from outside itself"
            exit 1
          fi
          echo "page is self-contained, $(stat -c%s web/dist/index.html) bytes"
